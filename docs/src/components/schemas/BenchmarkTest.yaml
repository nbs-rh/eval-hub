type: object
description: The test result of a single benchmark run
properties:
  primary_score:
    type: number
    format: float
    description: Primary score value
  threshold:
    type: number
    format: float
    description: Threshold value
  pass:
    type: boolean
    description: Whether the benchmark passed
  confidence_interval:
    $ref: ./ConfidenceInterval.yaml
    description: Confidence interval for the benchmark's primary score.
